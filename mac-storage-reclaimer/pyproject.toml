[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macreclaim"
version = "0.1.0"
description = "Reclaim disk space on macOS by finding and clearing known safe-to-delete caches and dev artifacts"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
macreclaim = "macreclaim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
